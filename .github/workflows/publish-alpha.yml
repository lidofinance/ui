name: Publish Alpha

# Manual alpha-style prerelease of any branch via semantic-release.
# Must be run from `main`: the `production` environment (and NPM_TOKEN) is only
# available there. The branch to release is passed as the `ref` input and checked
# out inside the job. NOTE: branch code (config, plugins, build scripts) runs in the
# same job as the token, exactly like publish-alpha.yml does for `develop` —
# keep the `production` environment protected (required reviewers) for this reason.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to release, must match release-alpha-* (e.g. release-alpha-breakpoints)
        required: true
        type: string
      dry_run:
        description: Dry run (compute versions, do not publish)
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-preview
  cancel-in-progress: false

permissions: {}

jobs:
  guard:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Ensure branch exists and is not behind main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          # Only release-alpha-<name> branches (lowercase letters, digits, dashes).
          # This also keeps the derived prerelease id / dist-tag valid.
          if ! [[ "$REF" =~ ^release-alpha-[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::branch '$REF' does not match release-alpha-*"
            exit 1
          fi
          # Same reason as in publish-alpha.yml: semantic-release only sees tags
          # reachable from the branch, so without main merged in it can compute
          # a version below the latest stable. Fails closed.
          behind=$(gh api "repos/$REPOSITORY/compare/$REF...main" --jq '.ahead_by')
          if ! [[ "$behind" =~ ^[0-9]+$ ]]; then
            echo "::error::could not compare $REF vs main (got: '$behind')"
            exit 1
          fi
          if [ "$behind" -gt 0 ]; then
            echo "::error::$REF is behind main by $behind commit(s) — merge main into it first"
            exit 1
          fi

  publish:
    needs: guard
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      id-token: write
    env:
      NODE_OPTIONS: --max_old_space_size=4096

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - run: yarn install --immutable

      - run: yarn build

